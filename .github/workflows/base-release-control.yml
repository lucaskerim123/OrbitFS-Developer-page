name: OrbitFS Base Release Control

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base release version (e.g. 1.0.0, v1.0.0.0, v.1.0.0, B0.0.0, D.0.0.0)"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: stable
        type: string
      source_ref:
        description: "Source branch/ref in V1-vercel-base"
        required: true
        default: base-release
        type: string
      notes:
        description: "Draft changelog from Developer Page"
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          test -n "$CHANNEL" || { echo "::error::Release channel is required."; exit 1; }
          [[ "$CHANNEL" =~ ^[a-z0-9][a-z0-9_-]{0,31}$ ]] || { echo "::error::Invalid release channel syntax: $CHANNEL"; exit 1; }

      - name: Dispatch Base release workflow
        env:
          GH_TOKEN: ${{ secrets.ORBITFS_RELEASE_DISPATCH_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source_ref }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing ORBITFS_RELEASE_DISPATCH_TOKEN repository secret."; exit 1; }
          SOURCE_SHA="$(gh api "repos/lucaskerim123/V1-vercel-base/commits/$SOURCE_REF" --jq '.sha')"
          test -n "$SOURCE_SHA" || { echo "::error::Could not resolve Base source SHA for $SOURCE_REF."; exit 1; }
          gh workflow run publish-base-release.yml \
            --repo lucaskerim123/V1-vercel-base \
            --ref "$SOURCE_REF" \
            -f version="$VERSION" \
            -f source_sha="$SOURCE_SHA" \
            -f channel="$CHANNEL" \
            -f notes="$NOTES"
          echo "Base release workflow dispatched for V1-vercel-base@$SOURCE_REF ($SOURCE_SHA), version $VERSION."
