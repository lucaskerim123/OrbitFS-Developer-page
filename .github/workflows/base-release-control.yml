name: OrbitFS Base Release Control

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base release SemVer"
        required: true
        type: string

      channel:
        description: "Release channel"
        required: true
        default: stable
        type: string

      source_ref:
        description: "Source branch/ref in V1-vercel-base"
        required: true
        default: base-release
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Normalize GitHub App private key
        id: normalize-key
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.ORBITFS_RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          printf '%s' "$APP_PRIVATE_KEY" |
            sed 's/\\n/\n/g' |
            tr -d '\r' > "$RUNNER_TEMP/github-app.pem"

          grep -q -- '-----BEGIN' "$RUNNER_TEMP/github-app.pem"
          grep -q -- '-----END' "$RUNNER_TEMP/github-app.pem"

          openssl rsa \
            -in "$RUNNER_TEMP/github-app.pem" \
            -check \
            -noout

          openssl pkcs8 \
            -topk8 \
            -nocrypt \
            -in "$RUNNER_TEMP/github-app.pem" \
            -out "$RUNNER_TEMP/github-app-pkcs8.pem"

          {
            echo 'key<<GITHUB_APP_KEY'
            cat "$RUNNER_TEMP/github-app-pkcs8.pem"
            echo 'GITHUB_APP_KEY'
          } >> "$GITHUB_OUTPUT"

          rm -f \
            "$RUNNER_TEMP/github-app.pem" \
            "$RUNNER_TEMP/github-app-pkcs8.pem"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.1.1
        with:
          client-id: Iv23linewJ05v7PcbAxa
          private-key: ${{ steps.normalize-key.outputs.key }}
          owner: lucaskerim123
          repositories: V1-vercel-base
          permission-actions: write

      - name: Dispatch Base release workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          gh workflow run release-to-license-master.yml \
            --repo lucaskerim123/V1-vercel-base \
            --ref "$SOURCE_REF" \
            -f version="$VERSION" \
            -f channel="$CHANNEL"

          echo "Base release workflow dispatched for V1-vercel-base@$SOURCE_REF, version $VERSION."
