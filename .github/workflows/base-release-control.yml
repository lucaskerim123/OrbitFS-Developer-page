name: OrbitFS Base Release Control

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base release SemVer"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: stable
        type: string
      source_ref:
        description: "Source branch/ref in V1-vercel-base"
        required: true
        default: base-release
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23linewJ05v7PcbAxa
          private-key: ${{ secrets.ORBITFS_RELEASE_APP_PRIVATE_KEY }}
          owner: lucaskerim123
          repositories: V1-vercel-base

      - name: Dispatch Base release workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          gh workflow run release-to-license-master.yml \
            --repo lucaskerim123/V1-vercel-base \
            --ref "$SOURCE_REF" \
            -f version="$VERSION" \
            -f channel="$CHANNEL"
          echo "Base release workflow dispatched for V1-vercel-base@$SOURCE_REF, version $VERSION."
