name: OrbitFS Base Release Control

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base release SemVer"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: stable
        type: string
      source_ref:
        description: "Source branch/ref in V1-vercel-base"
        required: true
        default: base-release
        type: string
      notes:
        description: "Draft changelog from Developer Page"
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          case "$CHANNEL" in stable|beta|dev) ;; *) echo "::error::Invalid release channel: $CHANNEL"; exit 1;; esac

      - name: Dispatch Base release workflow
        env:
          GH_TOKEN: ${{ secrets.ORBITFS_RELEASE_DISPATCH_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source_ref }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing ORBITFS_RELEASE_DISPATCH_TOKEN repository secret."; exit 1; }
          gh workflow run release-to-license-master.yml \
            --repo lucaskerim123/V1-vercel-base \
            --ref "$SOURCE_REF" \
            -f version="$VERSION" \
            -f channel="$CHANNEL" \
            -f notes="$NOTES"
          echo "Base release workflow dispatched for V1-vercel-base@$SOURCE_REF, version $VERSION."
