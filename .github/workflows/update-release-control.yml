name: OrbitFS Update Release Control

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Update version (e.g. 1.0.0, v1.0.0.0, v.1.0.0, B0.0.0, D.0.0.0)"
        required: true
        type: string
      channel:
        description: "Release delivery channel (stable, beta, or dev)"
        required: true
        default: stable
        type: string
      source_ref:
        description: "Engine source branch/ref"
        required: true
        default: UPDATE_RELEASE
        type: string
      base_channel:
        description: "Published Base channel used for compatibility"
        required: true
        default: stable
        type: string
      apex:
        description: "APEX changed"
        required: true
        default: false
        type: boolean
      mcp:
        description: "MCP changed"
        required: true
        default: false
        type: boolean
      studio:
        description: "Studio changed"
        required: true
        default: false
        type: boolean
      minimum_deployer_protocol:
        description: "Minimum Base Engine Deployer protocol"
        required: true
        default: "1"
        type: string
      minimum_base_version:
        description: "Minimum OrbitFS Base version required by this update"
        required: true
        default: "1.0.0"
        type: string
      notes:
        description: "Draft changelog from Developer Page"
        required: false
        type: string
      changed_files:
        description: "JSON list of files detected by Developer Page"
        required: false
        default: "[]"
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one component
        env:
          APEX: ${{ inputs.apex }}
          MCP: ${{ inputs.mcp }}
          STUDIO: ${{ inputs.studio }}
        run: |
          set -euo pipefail
          if [ "$APEX" != "true" ] && [ "$MCP" != "true" ] && [ "$STUDIO" != "true" ]; then
            echo "::error::Select at least one Engine update target (APEX, MCP, or Studio)."
            exit 1
          fi

      - name: Dispatch Engine update workflow
        env:
          GH_TOKEN: ${{ secrets.ORBITFS_RELEASE_DISPATCH_TOKEN }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source_ref }}
          BASE: ${{ inputs.base }}
          APEX: ${{ inputs.apex }}
          MCP: ${{ inputs.mcp }}
          STUDIO: ${{ inputs.studio }}
          PROTOCOL: ${{ inputs.minimum_deployer_protocol }}
          MINIMUM_BASE_VERSION: ${{ inputs.minimum_base_version }}
          BASE_CHANNEL: ${{ inputs.base_channel }}
          NOTES: ${{ inputs.notes }}
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing ORBITFS_RELEASE_DISPATCH_TOKEN repository secret."; exit 1; }
          SOURCE_SHA="$(gh api "repos/lucaskerim123/V1-vercel-engine/commits/$SOURCE_REF" --jq '.sha')"
          test -n "$SOURCE_SHA" || { echo "::error::Could not resolve Engine source SHA for $SOURCE_REF."; exit 1; }
          gh workflow run publish-engine-release.yml \
            --repo lucaskerim123/V1-vercel-engine \
            --ref "$SOURCE_REF" \
            -f version="$VERSION" \
            -f source_sha="$SOURCE_SHA" \
            -f channel="$CHANNEL" \
            -f base_channel="$BASE_CHANNEL" \
            -f apex="$APEX" \
            -f mcp="$MCP" \
            -f studio="$STUDIO" \
            -f minimum_deployer_protocol="$PROTOCOL" \
            -f minimum_base_version="$MINIMUM_BASE_VERSION" \
            -f notes="$NOTES" \
            -f changed_files="$CHANGED_FILES"
          echo "Engine update workflow dispatched for V1-vercel-engine@$SOURCE_REF ($SOURCE_SHA), version $VERSION."
