name: OrbitFS Update Release Control

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Global OrbitFS update version"
        required: true
        type: string
      channel:
        description: Release delivery channel (stable, beta, dev, or custom Billing Store channel)
        required: true
        default: stable
        type: string
      source_ref:
        description: "Engine source branch/ref"
        required: true
        default: UPDATE_RELEASE
        type: string
      apex:
        description: "APEX changed"
        required: true
        default: false
        type: boolean
      mcp:
        description: "MCP changed"
        required: true
        default: false
        type: boolean
      studio:
        description: "Studio changed"
        required: true
        default: false
        type: boolean
      minimum_deployer_protocol:
        description: "Minimum Base Engine Deployer protocol"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one component
        env:
          APEX: ${{ inputs.apex }}
          MCP: ${{ inputs.mcp }}
          STUDIO: ${{ inputs.studio }}
        run: |
          if [ "$APEX" != "true" ] && [ "$MCP" != "true" ] && [ "$STUDIO" != "true" ]; then
            echo "::error::Select at least one Engine component."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ORBITFS_RELEASE_APP_ID }}
          private-key: ${{ secrets.ORBITFS_RELEASE_APP_PRIVATE_KEY }}
          owner: lucaskerim123
          repositories: V1-vercel-engine

      - name: Dispatch Engine update workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.source_ref }}
          APEX: ${{ inputs.apex }}
          MCP: ${{ inputs.mcp }}
          STUDIO: ${{ inputs.studio }}
          PROTOCOL: ${{ inputs.minimum_deployer_protocol }}
        run: |
          set -euo pipefail
          gh workflow run publish-engine-release.yml \
            --repo lucaskerim123/V1-vercel-engine \
            --ref "$SOURCE_REF" \
            -f version="$VERSION" \
            -f channel="$CHANNEL" \
            -f apex="$APEX" \
            -f mcp="$MCP" \
            -f studio="$STUDIO" \
            -f minimum_deployer_protocol="$PROTOCOL"
          echo "Engine update workflow dispatched for V1-vercel-engine@$SOURCE_REF, version $VERSION."
